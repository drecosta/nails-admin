<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Bookings | Where Beauty Blooms By Megan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-page {
            min-height: 100vh;
            padding: 120px 1.25rem 60px;
            background: linear-gradient(to bottom, #fff 0%, var(--bg-cream) 100%);
        }
        
        .admin-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .admin-header h1 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        
        .admin-header p {
            color: var(--text-light);
            font-size: 1.1rem;
        }
        
        .admin-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .booking-count {
            background: white;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.15);
            color: var(--text-dark);
            font-weight: 600;
        }
        
        .bookings-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .booking-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 40px rgba(236, 72, 153, 0.12);
            border-left: 4px solid var(--primary);
            transition: all 0.3s ease;
        }
        
        .booking-card:hover {
            box-shadow: 0 15px 50px rgba(236, 72, 153, 0.2);
            transform: translateX(5px);
        }
        
        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        
        .booking-id {
            font-size: 0.8rem;
            color: #6b7280;
            font-family: monospace;
        }
        
        .booking-status {
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }
        
        .status-confirmed {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status-completed {
            background: #e0e7ff;
            color: #3730a3;
        }
        
        .booking-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .booking-detail {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        
        .booking-detail-label {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.85rem;
        }
        
        .booking-detail-value {
            color: var(--text-light);
            font-size: 0.95rem;
        }
        
        .booking-message {
            background: var(--bg-pink);
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1rem;
        }
        
        .booking-message-label {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            display: block;
        }
        
        .booking-message-content {
            color: var(--text-light);
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .booking-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        
        .btn-small {
            padding: 8px 18px;
            font-size: 0.875rem;
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(236, 72, 153, 0.12);
        }
        
        .empty-state i {
            font-size: 3rem;
            color: var(--primary-light);
            margin-bottom: 1rem;
        }
        
        .empty-state h3 {
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }
        
        .empty-state p {
            color: var(--text-light);
        }
        
        @media (max-width: 768px) {
            .admin-page {
                padding: 100px 1rem 40px;
            }
            
            .booking-header {
                flex-direction: column;
            }
            
            .booking-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="floating-flower flower1">🌸</div>
    <div class="floating-flower flower2">🌺</div>
    <div class="floating-flower flower3">🌷</div>
    <div class="floating-flower flower4">🌹</div>
    <div class="floating-flower flower5">💐</div>

    <header>
        <nav class="navbar">
            <div class="nav-container">
                <h1 class="logo">
                    <span class="logo-text">Where Beauty Blooms</span>
                    <span class="logo-by">by Megan</span>
                </h1>
                <ul class="nav-menu" style="position:static; flex-direction:row; background:transparent; box-shadow:none; padding:0; gap:2rem;">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link">← Back to Site</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="admin-page">
        <div class="container">
            <div class="admin-header">
                <h1>Booking Admin</h1>
                <p>View and manage all appointment requests</p>
            </div>

            <div class="bookings-container">
                <div class="admin-actions">
                    <div class="booking-count" id="bookingCount">
                        <i class="fas fa-calendar-check"></i> <span id="countText">0 Bookings</span>
                    </div>
                    <button class="btn btn-primary btn-small" onclick="clearAllBookings()">
                        <i class="fas fa-trash"></i> Clear All
                    </button>
                </div>

                <div id="bookingsList"></div>
            </div>
        </div>
    </div>

    <script>
        function loadBookings() {
            const bookings = JSON.parse(localStorage.getItem('nailsBookings') || '[]');
            const bookingsList = document.getElementById('bookingsList');
            const countText = document.getElementById('countText');
            
            countText.textContent = bookings.length + (bookings.length === 1 ? ' Booking' : ' Bookings');
            
            if (bookings.length === 0) {
                bookingsList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>No Bookings Yet</h3>
                        <p>When someone submits a booking form, it will appear here.</p>
                    </div>
                `;
                return;
            }
            
            // Sort by newest first
            bookings.sort((a, b) => b.id - a.id);
            
            bookingsList.innerHTML = bookings.map(booking => {
                const date = new Date(booking.date);
                const statusClass = booking.status === 'confirmed' ? 'status-confirmed' : 
                                   booking.status === 'completed' ? 'status-completed' : 'status-pending';
                const statusText = booking.status === 'confirmed' ? 'Confirmed' : 
                                  booking.status === 'completed' ? 'Completed' : 'Pending';
                
                return `
                    <div class="booking-card">
                        <div class="booking-header">
                            <div>
                                <h3 style="color: var(--text-dark); margin-bottom: 0.3rem;">${escapeHtml(booking.name)}</h3>
                                <span class="booking-id">ID: ${booking.id}</span>
                            </div>
                            <span class="booking-status ${statusClass}">${statusText}</span>
                        </div>
                        
                        <div class="booking-details">
                            <div class="booking-detail">
                                <span class="booking-detail-label"><i class="fas fa-phone"></i> Phone</span>
                                <span class="booking-detail-value">${escapeHtml(booking.phone)}</span>
                            </div>
                            <div class="booking-detail">
                                <span class="booking-detail-label"><i class="fas fa-spa"></i> Service</span>
                                <span class="booking-detail-value">${escapeHtml(booking.service)}</span>
                            </div>
                            <div class="booking-detail">
                                <span class="booking-detail-label"><i class="fas fa-clock"></i> Submitted</span>
                                <span class="booking-detail-value">${date.toLocaleString()}</span>
                            </div>
                        </div>
                        
                        ${booking.message ? `
                            <div class="booking-message">
                                <span class="booking-message-label"><i class="fas fa-comment"></i> Message</span>
                                <div class="booking-message-content">${escapeHtml(booking.message)}</div>
                            </div>
                        ` : ''}
                        
                        <div class="booking-actions">
                            <button class="btn btn-primary btn-small" onclick="updateStatus(${booking.id}, 'confirmed')">
                                <i class="fas fa-check"></i> Confirm
                            </button>
                            <button class="btn btn-secondary btn-small" style="background:#e0e7ff; color:#3730a3; border-color:#c7d2fe;" onclick="updateStatus(${booking.id}, 'completed')">
                                <i class="fas fa-check-double"></i> Complete
                            </button>
                            <button class="btn btn-secondary btn-small" style="background:#fef2f2; color:#991b1b; border-color:#fecaca;" onclick="deleteBooking(${booking.id})">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function updateStatus(id, status) {
            const bookings = JSON.parse(localStorage.getItem('nailsBookings') || '[]');
            const index = bookings.findIndex(b => b.id === id);
            if (index > -1) {
                bookings[index].status = status;
                localStorage.setItem('nailsBookings', JSON.stringify(bookings));
                loadBookings();
            }
        }
        
        function deleteBooking(id) {
            if (confirm('Are you sure you want to delete this booking?')) {
                let bookings = JSON.parse(localStorage.getItem('nailsBookings') || '[]');
                bookings = bookings.filter(b => b.id !== id);
                localStorage.setItem('nailsBookings', JSON.stringify(bookings));
                loadBookings();
            }
        }
        
        function clearAllBookings() {
            if (confirm('Are you sure you want to clear all bookings? This cannot be undone.')) {
                localStorage.removeItem('nailsBookings');
                loadBookings();
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        document.addEventListener('DOMContentLoaded', loadBookings);
    </script>
</body>
</html>
