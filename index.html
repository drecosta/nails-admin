<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Bookings | Where Beauty Blooms By Megan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #ec4899;
            --primary-light: #f9a8d4;
            --primary-dark: #be185d;
            --secondary: #a855f7;
            --bg-cream: #fef7f7;
            --bg-pink: #fdf2f8;
            --bg-rose: #fce7f3;
            --text-dark: #1e1b4b;
            --text-medium: #4c1d95;
            --text-light: #6b21a8;
            --white: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fef7f7 0%, #fdf2f8 50%, #fce7f3 100%);
            min-height: 100vh;
        }
        .admin-page {
            min-height: 100vh;
            padding: 110px 1.25rem 60px;
        }
        .admin-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .admin-header h1 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.8rem, 7vw, 4rem);
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        .admin-header p {
            color: var(--text-light);
            font-size: 1.05rem;
        }
        .admin-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .booking-count {
            background: linear-gradient(135deg, white 0%, #fef7f7 100%);
            padding: 0.8rem 1.8rem;
            border-radius: 50px;
            box-shadow: 0 8px 30px rgba(236, 72, 153, 0.18);
            color: var(--text-dark);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border: 1px solid rgba(249, 168, 212, 0.4);
        }
        .bookings-container {
            max-width: 1150px;
            margin: 0 auto;
        }
        .booking-card {
            background: linear-gradient(135deg, white 0%, #fefbff 100%);
            border-radius: 24px;
            padding: 1.8rem;
            margin-bottom: 1.8rem;
            box-shadow: 0 12px 50px rgba(236, 72, 153, 0.16);
            border: 1px solid rgba(249, 168, 212, 0.35);
            position: relative;
            overflow: hidden;
        }
        .booking-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--primary));
        }
        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .booking-status {
            padding: 0.45rem 1rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .status-pending {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            color: #92400e;
        }
        .status-confirmed {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            color: #065f46;
        }
        .status-completed {
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
            color: #312e81;
        }
        .booking-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.2rem;
        }
        .booking-detail {
            background: linear-gradient(135deg, var(--bg-pink) 0%, white 100%);
            padding: 0.9rem 1rem;
            border-radius: 14px;
            border: 1px solid rgba(249, 168, 212, 0.3);
        }
        .booking-detail-label {
            font-weight: 700;
            color: var(--text-dark);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.3rem;
        }
        .booking-detail-label i {
            color: var(--primary);
        }
        .booking-detail-value {
            color: var(--text-medium);
            font-size: 0.95rem;
            font-weight: 500;
        }
        .booking-message {
            background: linear-gradient(135deg, var(--bg-pink) 0%, white 100%);
            padding: 1rem 1.2rem;
            border-radius: 14px;
            margin-top: 1rem;
            border: 1px solid rgba(249, 168, 212, 0.35);
        }
        .booking-message-label {
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .booking-message-label i {
            color: var(--primary);
        }
        .booking-message-content {
            color: var(--text-medium);
            line-height: 1.7;
            white-space: pre-wrap;
        }
        .booking-actions {
            display: flex;
            gap: 0.7rem;
            flex-wrap: wrap;
            margin-top: 1.2rem;
        }
        .btn-small {
            padding: 9px 18px;
            font-size: 0.875rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(236, 72, 153, 0.45);
        }
        .btn-secondary {
            background: white;
            color: var(--text-dark);
            border: 1.5px solid rgba(249, 168, 212, 0.6);
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.1);
        }
        .schedule-form {
            margin-top: 1.2rem;
            padding: 1.2rem;
            background: linear-gradient(135deg, #eff6ff 0%, white 100%);
            border-radius: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 0.9rem;
            align-items: end;
            border: 1.5px solid #bfdbfe;
        }
        .schedule-form input {
            padding: 11px 14px;
            border: 2px solid #bfdbfe;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            background: white;
        }
        .schedule-form label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 700;
            color: var(--text-dark);
            font-size: 0.8rem;
            margin-bottom: 0.4rem;
        }
        .schedule-form label i {
            color: #2563eb;
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(135deg, white 0%, #fefbff 100%);
            border-radius: 24px;
            box-shadow: 0 12px 50px rgba(236, 72, 153, 0.16);
            border: 1px solid rgba(249, 168, 212, 0.35);
        }
        .empty-state i {
            font-size: 3.5rem;
            color: var(--primary-light);
            margin-bottom: 1rem;
        }
        .empty-state h3 {
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            font-size: 1.4rem;
        }
        .empty-state p {
            color: var(--text-light);
        }
        .navbar {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(15px);
            box-shadow: 0 4px 30px rgba(236, 72, 153, 0.12);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(249, 168, 212, 0.3);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.7rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'Great Vibes', cursive;
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        @media (max-width: 768px) {
            .admin-page { padding: 95px 1rem 40px; }
            .booking-header { flex-direction: column; }
            .booking-details { grid-template-columns: 1fr; }
            .schedule-form { grid-template-columns: 1fr; }
            .booking-card { padding: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="floating-flower flower1">🌸</div>
    <div class="floating-flower flower2">🌺</div>
    <div class="floating-flower flower3">🌷</div>
    <div class="floating-flower flower4">🌹</div>
    <div class="floating-flower flower5">💐</div>

    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">Where Beauty Blooms by Megan</div>
                <div style="color: var(--text-light); font-weight: 500; font-size: 0.9rem;">
                    <i class="fas fa-crown"></i> Admin Panel
                </div>
            </div>
        </nav>
    </header>

    <div class="admin-page">
        <div class="container">
            <div class="admin-header">
                <h1>Booking Admin</h1>
                <p>View and manage all appointment requests</p>
            </div>

            <div class="bookings-container">
                <div class="admin-actions">
                    <div class="booking-count" id="bookingCount">
                        <i class="fas fa-calendar-check"></i> <span id="countText">0 Bookings</span>
                    </div>
                    <div style="display: flex; gap: 0.8rem; flex-wrap: wrap;">
                        <a href="https://drecosta.github.io/nails-appointments/" target="_blank" class="btn-primary btn-small" style="text-decoration: none;">
                            <i class="fas fa-calendar-alt"></i> Open Appointments Diary
                        </a>
                        <a href="https://drecosta.github.io/nails/" target="_blank" class="btn-secondary btn-small" style="text-decoration: none;">
                            <i class="fas fa-globe"></i> View Website
                        </a>
                    </div>
                </div>

                <div id="bookingsList"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBuMawZjjzJum0fy9UPw3vqwfK19uSrM9w",
            authDomain: "rsvp-7faf9.firebaseapp.com",
            databaseURL: "https://rsvp-7faf9-default-rtdb.firebaseio.com",
            projectId: "rsvp-7faf9",
            storageBucket: "rsvp-7faf9.firebasestorage.app",
            messagingSenderId: "657790462564",
            appId: "1:657790462564:web:f3e2a230425c218c624d71"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allBookings = {};

        function loadBookings() {
            const bookingsList = document.getElementById('bookingsList');
            const countText = document.getElementById('countText');
            
            const bookingEntries = Object.entries(allBookings);
            countText.textContent = bookingEntries.length + (bookingEntries.length === 1 ? ' Booking' : ' Bookings');
            
            if (bookingEntries.length === 0) {
                bookingsList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>No Bookings Yet</h3>
                        <p>When someone submits a booking form, it will appear here.</p>
                    </div>
                `;
                return;
            }
            
            // Sort by date (newest first)
            bookingEntries.sort((a, b) => {
                const dateA = new Date(a[1].submittedAt || a[1].date || 0);
                const dateB = new Date(b[1].submittedAt || b[1].date || 0);
                return dateB - dateA;
            });
            
            bookingsList.innerHTML = bookingEntries.map(([key, booking]) => {
                const submittedDate = new Date(booking.submittedAt || booking.date);
                const statusClass = booking.status === 'confirmed' ? 'status-confirmed' : 
                                   booking.status === 'completed' ? 'status-completed' : 'status-pending';
                const statusText = booking.status === 'confirmed' ? 'Confirmed' : 
                                  booking.status === 'completed' ? 'Completed' : 'Pending';
                
                return `
                    <div class="booking-card">
                        <div class="booking-header">
                            <div>
                                <h3 style="color: var(--text-dark); margin-bottom: 0.3rem;">${escapeHtml(booking.name || '')}</h3>
                            </div>
                            <span class="booking-status ${statusClass}">${statusText}</span>
                        </div>
                        
                        <div class="booking-details">
                            <div class="booking-detail">
                                <span class="booking-detail-label"><i class="fas fa-phone"></i> Phone</span>
                                <span class="booking-detail-value">${escapeHtml(booking.phone || '')}</span>
                            </div>
                            <div class="booking-detail">
                                <span class="booking-detail-label"><i class="fas fa-spa"></i> Service</span>
                                <span class="booking-detail-value">${escapeHtml(booking.service || '')}</span>
                            </div>
                            <div class="booking-detail">
                                <span class="booking-detail-label"><i class="fas fa-calendar"></i> Requested Date</span>
                                <span class="booking-detail-value">${escapeHtml(booking.requestedDate || 'Not specified')}</span>
                            </div>
                            <div class="booking-detail">
                                <span class="booking-detail-label"><i class="fas fa-clock"></i> Requested Time</span>
                                <span class="booking-detail-value">${escapeHtml(booking.requestedTime || 'Not specified')}</span>
                            </div>
                            <div class="booking-detail">
                                <span class="booking-detail-label"><i class="fas fa-paper-plane"></i> Submitted</span>
                                <span class="booking-detail-value">${submittedDate.toLocaleString()}</span>
                            </div>
                        </div>
                        
                        ${booking.message ? `
                            <div class="booking-message">
                                <span class="booking-message-label"><i class="fas fa-comment"></i> Message</span>
                                <div class="booking-message-content">${escapeHtml(booking.message)}</div>
                            </div>
                        ` : ''}
                        
                        ${booking.status === 'confirmed' ? `
                            <div class="booking-message" style="background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%); border: 2px solid #86efac;">
                                <span class="booking-message-label" style="color: #065f46;"><i class="fas fa-calendar-check"></i> Scheduled Appointment</span>
                                <div style="color: #065f46; font-weight: 600;">
                                    ${escapeHtml(booking.scheduledDate || booking.requestedDate)} at ${escapeHtml(booking.scheduledTime || booking.requestedTime)}
                                </div>
                                ${booking.addedToDiary ? '<div style="color: #047857; font-size: 0.9rem; margin-top: 0.3rem;"><i class="fas fa-check"></i> Added to Nails Diary</div>' : ''}
                            </div>
                        ` : ''}
                        
                        <div class="schedule-form">
                            <div>
                                <label>Schedule Date</label>
                                <input type="date" id="scheduleDate_${key}" value="${escapeHtml(booking.scheduledDate || booking.requestedDate || '')}">
                            </div>
                            <div>
                                <label>Schedule Time</label>
                                <input type="time" id="scheduleTime_${key}" value="${escapeHtml(booking.scheduledTime || booking.requestedTime || '')}">
                            </div>
                            <button class="btn btn-primary btn-small" onclick="window.confirmAndSchedule('${key}')">
                                <i class="fas fa-calendar-plus"></i> Confirm & Schedule
                            </button>
                        </div>
                        
                        <div class="booking-actions">
                            <button class="btn btn-secondary btn-small" style="background:#e0e7ff; color:#3730a3; border-color:#c7d2fe;" onclick="window.updateStatus('${key}', 'completed')">
                                <i class="fas fa-check-double"></i> Mark Complete
                            </button>
                            <button class="btn btn-secondary btn-small" style="background:#fef2f2; color:#991b1b; border-color:#fecaca;" onclick="window.deleteBooking('${key}')">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        window.updateStatus = function(key, status) {
            const bookingRef = ref(db, `bookings/${key}`);
            update(bookingRef, { status });
        }
        
        window.confirmAndSchedule = async function(key) {
            const booking = allBookings[key];
            const scheduledDate = document.getElementById(`scheduleDate_${key}`).value;
            const scheduledTime = document.getElementById(`scheduleTime_${key}`).value;
            
            if (!scheduledDate || !scheduledTime) {
                alert('Please select a date and time');
                return;
            }
            
            // Add to diary
            const diaryTask = {
                id: Date.now(),
                title: `${booking.name} - ${booking.service}`,
                notes: `Phone: ${booking.phone}\nTime: ${scheduledTime}\n${booking.message ? 'Notes: ' + booking.message : ''}`,
                date: scheduledDate,
                done: false,
                starred: false,
                group: 'Appointments',
                createdAt: Date.now(),
                fromBooking: key
            };
            
            const diaryRef = ref(db, 'diary/tasks');
            const { push: diaryPush, set: diarySet } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js");
            const newDiaryRef = diaryPush(diaryRef);
            await diarySet(newDiaryRef, diaryTask);
            
            // Update booking
            const bookingRef = ref(db, `bookings/${key}`);
            update(bookingRef, { 
                status: 'confirmed',
                scheduledDate,
                scheduledTime,
                addedToDiary: true,
                diaryTaskId: newDiaryRef.key
            });
            
            alert('Appointment confirmed and added to Nails Diary!');
        }
        
        window.deleteBooking = function(key) {
            if (confirm('Are you sure you want to delete this booking?')) {
                const bookingRef = ref(db, `bookings/${key}`);
                remove(bookingRef);
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        const bookingsRef = ref(db, 'bookings');
        onValue(bookingsRef, (snapshot) => {
            allBookings = snapshot.val() || {};
            loadBookings();
        });
    </script>
</body>
</html>
