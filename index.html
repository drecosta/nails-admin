<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Booking Admin | Where Beauty Blooms By Megan</title>
    <meta name="description" content="Private booking admin and nail calendar for Where Beauty Blooms By Megan.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ec4899">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BB Admin">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="admin-topbar">
        <div class="admin-brand">
            <span class="admin-brand-title">Where Beauty Blooms</span>
            <span class="admin-brand-sub">Booking Admin</span>
        </div>
        <div class="admin-badge"><i class="fas fa-lock"></i> Private</div>
    </header>

    <main class="admin-content">
        <div class="admin-header">
            <h1>Booking Admin</h1>
            <p>View your nail calendar and manage every appointment in one place</p>
        </div>

        <section class="calendar-card" aria-label="Appointment calendar">
            <div class="calendar-head">
                <button type="button" class="calendar-nav" id="calPrev" aria-label="Previous month">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <h2 id="calTitle">Month</h2>
                <button type="button" class="calendar-nav" id="calNext" aria-label="Next month">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            <div class="calendar-weekdays" aria-hidden="true">
                <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
            <div class="calendar-legend">
                <span><i class="legend-dot legend-dot-booking"></i> Appointment</span>
                <span><i class="legend-dot legend-dot-today"></i> Today</span>
            </div>
        </section>

        <div class="admin-actions">
            <div class="booking-count" id="bookingCount">
                <i class="fas fa-calendar-check"></i> <span id="countText">0 Bookings</span>
            </div>
            <div class="admin-actions-buttons">
                <button type="button" class="btn btn-secondary btn-small" id="filterClear" hidden>
                    <i class="fas fa-calendar-day"></i> All dates
                </button>
                <button type="button" class="btn btn-primary btn-small" id="clearAll">
                    <i class="fas fa-trash"></i> Clear All
                </button>
            </div>
        </div>

        <div id="bookingsList" class="bookings-container" aria-live="polite"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBuMawZjjzJum0fy9UPw3vqwfK19uSrM9w",
            authDomain: "rsvp-7faf9.firebaseapp.com",
            databaseURL: "https://rsvp-7faf9-default-rtdb.firebaseio.com",
            projectId: "rsvp-7faf9",
            storageBucket: "rsvp-7faf9.firebasestorage.app",
            messagingSenderId: "657790462564",
            appId: "1:657790462564:web:f3e2a230425c218c624d71"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const bookingsRef = ref(db, 'bookings');

        const state = {
            bookings: [],
            loaded: false,
            error: '',
            monthCursor: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
            selectedDate: null
        };

        const els = {
            list: document.getElementById('bookingsList'),
            count: document.getElementById('countText'),
            grid: document.getElementById('calendarGrid'),
            title: document.getElementById('calTitle'),
            filterClear: document.getElementById('filterClear'),
            clearAll: document.getElementById('clearAll'),
            prev: document.getElementById('calPrev'),
            next: document.getElementById('calNext')
        };

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function dateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatDisplayDate(key) {
            if (!key) return 'Not set';
            const [year, month, day] = key.split('-').map(Number);
            if (!year || !month || !day) return key;
            return new Date(year, month - 1, day).toLocaleDateString(undefined, {
                weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
            });
        }

        function formatTime(value) {
            if (!value) return 'Not set';
            const [hours, minutes] = value.split(':').map(Number);
            if (Number.isNaN(hours)) return value;
            const date = new Date();
            date.setHours(hours, minutes || 0, 0, 0);
            return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }

        function statusMeta(status) {
            if (status === 'confirmed') return { className: 'status-confirmed', text: 'Confirmed' };
            if (status === 'completed') return { className: 'status-completed', text: 'Completed' };
            return { className: 'status-pending', text: 'Pending' };
        }

        function renderCalendar() {
            const { monthCursor, bookings, selectedDate } = state;
            const year = monthCursor.getFullYear();
            const month = monthCursor.getMonth();

            els.title.textContent = monthCursor.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

            const counts = {};
            bookings.forEach((booking) => {
                if (booking.requestedDate) {
                    counts[booking.requestedDate] = (counts[booking.requestedDate] || 0) + 1;
                }
            });

            const leading = (new Date(year, month, 1).getDay() + 6) % 7;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = dateKey(new Date());

            let html = '';
            for (let i = 0; i < leading; i++) {
                html += '<div class="calendar-day empty" aria-hidden="true"></div>';
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const key = dateKey(new Date(year, month, day));
                const count = counts[key] || 0;
                const classes = ['calendar-day'];
                if (key === today) classes.push('is-today');
                if (key === selectedDate) classes.push('selected');
                if (count) classes.push('has-booking');
                const label = `${formatDisplayDate(key)}${count ? `, ${count} appointment${count === 1 ? '' : 's'}` : ''}`;

                html += `<button type="button" class="${classes.join(' ')}" data-date="${key}" aria-label="${label}">
                    <span class="day-number">${day}</span>
                    ${count ? `<span class="day-count">${count}</span>` : ''}
                </button>`;
            }

            els.grid.innerHTML = html;
            els.filterClear.hidden = !selectedDate;
        }

        function renderBookings() {
            const { bookings, loaded, error, selectedDate } = state;

            if (!loaded) {
                els.count.textContent = 'Loading bookings...';
                els.list.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><h3>Loading bookings</h3><p>Fetching your latest appointments.</p></div>';
                return;
            }

            if (error) {
                els.count.textContent = 'Bookings unavailable';
                els.list.innerHTML = `<div class="empty-state"><i class="fas fa-triangle-exclamation"></i><h3>Could not load bookings</h3><p>${escapeHtml(error)}</p></div>`;
                return;
            }

            const filtered = selectedDate
                ? bookings.filter((booking) => booking.requestedDate === selectedDate)
                : bookings;

            els.count.textContent = `${bookings.length} Booking${bookings.length === 1 ? '' : 's'}${selectedDate ? ` · ${filtered.length} on ${formatDisplayDate(selectedDate)}` : ''}`;

            if (!filtered.length) {
                els.list.innerHTML = `<div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <h3>${selectedDate ? 'No bookings on this date' : 'No Bookings Yet'}</h3>
                    <p>${selectedDate ? 'Choose another day or show all dates.' : 'When someone submits a booking form, it will appear here.'}</p>
                </div>`;
                return;
            }

            els.list.innerHTML = filtered.map((booking) => {
                const status = statusMeta(booking.status);
                const submitted = booking.submittedAt && !Number.isNaN(Date.parse(booking.submittedAt))
                    ? new Date(booking.submittedAt).toLocaleString()
                    : '—';

                return `
                    <article class="booking-card">
                        <div class="booking-header">
                            <div>
                                <h3>${escapeHtml(booking.name || 'Unnamed')}</h3>
                                <span class="booking-id">ID: ${escapeHtml(booking.id)}</span>
                            </div>
                            <span class="booking-status ${status.className}">${status.text}</span>
                        </div>

                        <div class="booking-details">
                            <div class="booking-detail">
                                <span class="booking-detail-label"><i class="fas fa-calendar-day"></i> Appointment</span>
                                <span class="booking-detail-value">${escapeHtml(formatDisplayDate(booking.requestedDate))}</span>
                            </div>
                            <div class="booking-detail">
                                <span class="booking-detail-label"><i class="fas fa-clock"></i> Time</span>
                                <span class="booking-detail-value">${escapeHtml(formatTime(booking.requestedTime))}</span>
                            </div>
                            <div class="booking-detail">
                                <span class="booking-detail-label"><i class="fas fa-phone"></i> Phone</span>
                                <span class="booking-detail-value">${escapeHtml(booking.phone || '—')}</span>
                            </div>
                            <div class="booking-detail">
                                <span class="booking-detail-label"><i class="fas fa-spa"></i> Service</span>
                                <span class="booking-detail-value">${escapeHtml(booking.service || '—')}</span>
                            </div>
                            <div class="booking-detail">
                                <span class="booking-detail-label"><i class="fas fa-paper-plane"></i> Submitted</span>
                                <span class="booking-detail-value">${escapeHtml(submitted)}</span>
                            </div>
                        </div>

                        ${booking.message ? `
                            <div class="booking-message">
                                <span class="booking-message-label"><i class="fas fa-comment"></i> Message</span>
                                <div class="booking-message-content">${escapeHtml(booking.message)}</div>
                            </div>
                        ` : ''}

                        <div class="booking-actions">
                            <button type="button" class="btn btn-primary btn-small" data-action="confirmed" data-id="${escapeHtml(booking.id)}">
                                <i class="fas fa-check"></i> Confirm
                            </button>
                            <button type="button" class="btn btn-secondary btn-small btn-complete" data-action="completed" data-id="${escapeHtml(booking.id)}">
                                <i class="fas fa-check-double"></i> Complete
                            </button>
                            <button type="button" class="btn btn-secondary btn-small btn-danger" data-action="delete" data-id="${escapeHtml(booking.id)}">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function render() {
            renderCalendar();
            renderBookings();
        }

        function shiftMonth(delta) {
            state.monthCursor = new Date(
                state.monthCursor.getFullYear(),
                state.monthCursor.getMonth() + delta,
                1
            );
            state.selectedDate = null;
            render();
        }

        onValue(bookingsRef, (snapshot) => {
            state.bookings = [];
            snapshot.forEach((child) => {
                state.bookings.push({ id: child.key, ...child.val() });
            });
            state.bookings.sort((a, b) => {
                const aKey = `${a.requestedDate || ''} ${a.requestedTime || ''}`;
                const bKey = `${b.requestedDate || ''} ${b.requestedTime || ''}`;
                return aKey.localeCompare(bKey);
            });
            state.loaded = true;
            state.error = '';
            render();
        }, (err) => {
            state.loaded = true;
            state.error = err.message;
            render();
        });

        els.grid.addEventListener('click', (event) => {
            const day = event.target.closest('.calendar-day[data-date]');
            if (!day) return;
            const key = day.dataset.date;
            state.selectedDate = state.selectedDate === key ? null : key;
            render();
        });

        els.prev.addEventListener('click', () => shiftMonth(-1));
        els.next.addEventListener('click', () => shiftMonth(1));

        els.filterClear.addEventListener('click', () => {
            state.selectedDate = null;
            render();
        });

        els.clearAll.addEventListener('click', async () => {
            if (!state.bookings.length) return;
            if (!confirm('Clear all bookings? This cannot be undone.')) return;
            try {
                await remove(bookingsRef);
            } catch (err) {
                alert('Could not clear bookings: ' + err.message);
            }
        });

        els.list.addEventListener('click', async (event) => {
            const button = event.target.closest('button[data-action]');
            if (!button) return;

            const { action, id } = button.dataset;
            if (!id) return;

            if (action === 'delete' && !confirm('Delete this booking?')) return;

            button.disabled = true;
            try {
                if (action === 'delete') {
                    await remove(ref(db, `bookings/${id}`));
                } else {
                    await update(ref(db, `bookings/${id}`), { status: action });
                }
            } catch (err) {
                alert('Could not update booking: ' + err.message);
                button.disabled = false;
            }
        });

        render();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.warn('Service worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
